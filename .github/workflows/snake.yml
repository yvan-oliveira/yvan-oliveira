
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F5C542&color_dots=%23EBEDF0,%23B7D8F5,%236AADE4,%232F81D2,%231B4F9C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F5C542&color_dots=%230D1117,%231B4F9C,%232F81D2,%236AADE4,%23F5C542

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
